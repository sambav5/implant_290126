AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate deployment for the implant React frontend and FastAPI backend.

Parameters:
  ProjectName:
    Type: String
    Default: implant
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{1,30}$'
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9-]{2,20}$'
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ALB and ECS services. The deployment scripts default this to the account default VPC.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB and Fargate tasks. The deployment scripts default this to default public subnets.
  FrontendImageUri:
    Type: String
    Description: Full frontend image URI including tag.
  BackendImageUri:
    Type: String
    Description: Full backend image URI including tag.
  FrontendContainerPort:
    Type: Number
    Default: 80
  BackendContainerPort:
    Type: Number
    Default: 8001
  FrontendDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  BackendDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  FrontendCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  FrontendMemory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
  BackendCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  BackendMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 3653]
  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  HealthCheckGracePeriodSeconds:
    Type: Number
    Default: 60
  AppSecretArn:
    Type: String
    Description: Secrets Manager secret ARN containing sensitive container environment variables as JSON keys.
  DbName:
    Type: String
    Default: dental_app
  JwtAlgorithm:
    Type: String
    Default: HS256
  JwtExpireDays:
    Type: Number
    Default: 7
  CorsOrigins:
    Type: String
    Default: '*'
  AppEnv:
    Type: String
    Default: production
  WebConcurrency:
    Type: Number
    Default: 2
  GunicornTimeout:
    Type: Number
    Default: 120
  TwilioWhatsappFrom:
    Type: String
    Default: ''
  TwilioTemplateSid:
    Type: String
    Default: ''
  SpeechToTextProvider:
    Type: String
    Default: openai_whisper
  SpeechToTextModel:
    Type: String
    Default: whisper-1
  SpeechToTextLanguage:
    Type: String
    Default: ''
  SpeechToTextTimeoutSeconds:
    Type: Number
    Default: 30
  SpeechToTextMaxBytes:
    Type: Number
    Default: 25000000
  IntentEngine:
    Type: String
    Default: openai
  IntentEngineProvider:
    Type: String
    Default: openai
  IntentEngineModel:
    Type: String
    Default: gpt-5.4
  IntentEngineTimeoutSeconds:
    Type: Number
    Default: 15
  VoiceConfidenceThreshold:
    Type: String
    Default: ''
  FileStorageDriver:
    Type: String
    Default: local
  LocalUploadsDir:
    Type: String
    Default: /app/uploads
  ReactAppBackendUrl:
    Type: String
    Default: ''
    Description: Public backend origin for frontend runtime config. Leave empty to use same-origin ALB /api routing.
  ReactAppPosthogHost:
    Type: String
    Default: https://us.i.posthog.com
  ReactAppDemoMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${EnvironmentName}'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${EnvironmentName} public ALB access'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-alb-sg'

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${EnvironmentName} ECS service access from ALB'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FrontendContainerPort
          ToPort: !Ref FrontendContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: !Ref BackendContainerPort
          ToPort: !Ref BackendContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-service-sg'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref FrontendContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref BackendContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  BackendApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendUploadsListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values:
            - /uploads/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/frontend'
      RetentionInDays: !Ref LogRetentionDays

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/backend'
      RetentionInDays: !Ref LogRetentionDays

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadApplicationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcsExecMessages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-frontend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref FrontendCpu
      Memory: !Ref FrontendMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref FrontendContainerPort
              Protocol: tcp
          Environment:
            - Name: REACT_APP_BACKEND_URL
              Value: !Ref ReactAppBackendUrl
            - Name: REACT_APP_POSTHOG_HOST
              Value: !Ref ReactAppPosthogHost
            - Name: REACT_APP_DEMO_MODE
              Value: !Ref ReactAppDemoMode
            - Name: NGINX_API_PROXY
              Value: !Sub 'http://${LoadBalancer.DNSName}'
          Secrets:
            - Name: REACT_APP_POSTHOG_KEY
              ValueFrom: !Sub '${AppSecretArn}:REACT_APP_POSTHOG_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-backend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref BackendContainerPort
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref AppEnv
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: JWT_ALGORITHM
              Value: !Ref JwtAlgorithm
            - Name: JWT_EXPIRE_DAYS
              Value: !Sub '${JwtExpireDays}'
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: PORT
              Value: !Sub '${BackendContainerPort}'
            - Name: WEB_CONCURRENCY
              Value: !Sub '${WebConcurrency}'
            - Name: GUNICORN_TIMEOUT
              Value: !Sub '${GunicornTimeout}'
            - Name: TWILIO_WHATSAPP_FROM
              Value: !Ref TwilioWhatsappFrom
            - Name: TWILIO_TEMPLATE_SID
              Value: !Ref TwilioTemplateSid
            - Name: SPEECH_TO_TEXT_PROVIDER
              Value: !Ref SpeechToTextProvider
            - Name: SPEECH_TO_TEXT_MODEL
              Value: !Ref SpeechToTextModel
            - Name: SPEECH_TO_TEXT_LANGUAGE
              Value: !Ref SpeechToTextLanguage
            - Name: SPEECH_TO_TEXT_TIMEOUT_SECONDS
              Value: !Sub '${SpeechToTextTimeoutSeconds}'
            - Name: SPEECH_TO_TEXT_MAX_BYTES
              Value: !Sub '${SpeechToTextMaxBytes}'
            - Name: INTENT_ENGINE
              Value: !Ref IntentEngine
            - Name: INTENT_ENGINE_PROVIDER
              Value: !Ref IntentEngineProvider
            - Name: INTENT_ENGINE_MODEL
              Value: !Ref IntentEngineModel
            - Name: INTENT_ENGINE_TIMEOUT_SECONDS
              Value: !Sub '${IntentEngineTimeoutSeconds}'
            - Name: VOICE_CONFIDENCE_THRESHOLD
              Value: !Ref VoiceConfidenceThreshold
            - Name: FILE_STORAGE_DRIVER
              Value: !Ref FileStorageDriver
            - Name: LOCAL_UPLOADS_DIR
              Value: !Ref LocalUploadsDir
          Secrets:
            - Name: MONGO_URL
              ValueFrom: !Sub '${AppSecretArn}:MONGO_URL::'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecretArn}:JWT_SECRET::'
            - Name: TWILIO_ACCOUNT_SID
              ValueFrom: !Sub '${AppSecretArn}:TWILIO_ACCOUNT_SID::'
            - Name: TWILIO_AUTH_TOKEN
              ValueFrom: !Sub '${AppSecretArn}:TWILIO_AUTH_TOKEN::'
            - Name: EMERGENT_LLM_KEY
              ValueFrom: !Sub '${AppSecretArn}:EMERGENT_LLM_KEY::'
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub '${AppSecretArn}:OPENAI_API_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-${EnvironmentName}-frontend'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref FrontendDesiredCount
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      TaskDefinition: !Ref FrontendTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: !Ref FrontendContainerPort
          TargetGroupArn: !Ref FrontendTargetGroup

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendApiListenerRule
      - BackendUploadsListenerRule
    Properties:
      ServiceName: !Sub '${ProjectName}-${EnvironmentName}-backend'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref BackendDesiredCount
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: !Ref HealthCheckGracePeriodSeconds
      TaskDefinition: !Ref BackendTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: !Ref BackendContainerPort
          TargetGroupArn: !Ref BackendTargetGroup

Outputs:
  AlbDnsName:
    Description: Public DNS name of the application load balancer.
    Value: !GetAtt LoadBalancer.DNSName
  ApplicationUrl:
    Description: HTTP application URL.
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  EcsClusterName:
    Description: ECS cluster name.
    Value: !Ref Cluster
  FrontendServiceName:
    Description: Frontend ECS service name.
    Value: !GetAtt FrontendService.Name
  BackendServiceName:
    Description: Backend ECS service name.
    Value: !GetAtt BackendService.Name
  FrontendTaskDefinitionArn:
    Description: Frontend task definition ARN.
    Value: !Ref FrontendTaskDefinition
  BackendTaskDefinitionArn:
    Description: Backend task definition ARN.
    Value: !Ref BackendTaskDefinition
  FrontendTargetGroupArn:
    Description: Frontend target group ARN.
    Value: !Ref FrontendTargetGroup
  BackendTargetGroupArn:
    Description: Backend target group ARN.
    Value: !Ref BackendTargetGroup
