AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated VPC and public networking for the implant ECS Fargate deployment.

Parameters:
  ProjectName:
    Type: String
    Default: implant
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{1,30}$'
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9-]{2,20}$'
  VpcCidr:
    Type: String
    Default: 10.100.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.100.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.100.1.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-a'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

Outputs:
  VpcId:
    Description: Dedicated VPC ID.
    Value: !Ref Vpc
  PublicSubnetIds:
    Description: Comma-separated public subnet IDs.
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PublicSubnet1Id:
    Description: First public subnet ID.
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Description: Second public subnet ID.
    Value: !Ref PublicSubnet2
