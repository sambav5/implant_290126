services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: dental_app
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-testing-only}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: 7
      PORT: 8001
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
      NGINX_API_PROXY: http://backend:8001
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
